<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="100%" height="100%">
  <!-- Stylized Blue Tooth Icon -->
  <g transform="translate(300, 5)">
    <path d="M40,5 C55,5 65,15 70,35 C73,47 70,60 62,70 C55,78 50,88 48,100 C46,112 48,125 40,130 C32,135 25,125 23,112 C21,100 18,92 12,85 C4,75 0,60 3,45 C7,25 22,5 40,5 Z"
          fill="#ffffff" stroke="#38b5e8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40,5 C55,5 65,15 70,35 C73,47 70,60 62,70 C55,78 50,88 48,100 C46,112 48,125 40,130 C32,135 25,125 23,112 C21,100 18,92 12,85 C4,75 0,60 3,45 C7,25 22,5 40,5 Z"
          fill="url(#toothGrad)" opacity="0.25"/>
  </g>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
  </defs>

  <!-- Clinic name (bold, all caps) -->
  <text x="10" y="60" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#2c3e50" letter-spacing="2">DENTAL</text>

  <!-- Dental Clinic (lighter, sentence case) -->
  <text x="12" y="110" font-family="Arial, Helvetica, sans-serif" font-weight="300" font-size="42" fill="#2c3e50">Dental Clinic</text>
</svg>
